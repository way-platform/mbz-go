edition = "2023";

package wayplatform.connect.mbz.v1;

import "google/protobuf/timestamp.proto";

// A signal that could not be mapped to the canonical Signal message.
message UnmappedSignal {
  // Original signal name from the Mercedes-Benz push API.
  string name = 1;

  // Timestamp of the signal.
  google.protobuf.Timestamp time = 2;

  // Raw value as sent by Mercedes-Benz (always a string).
  string value = 3;

  // Raw JSON type (ENUM, BOOLEAN, ...).
  string type = 4;

  // Reason the signal could not be mapped.
  Reason reason = 5;

  // Reason a signal could not be mapped to the canonical Signal message.
  enum Reason {
    // Default value. This value is not used.
    REASON_UNSPECIFIED = 0;

    // The signal name is not present in the signal identifier schema.
    UNKNOWN_NAME = 1;

    // The signal name is known but the value is not a valid enum member.
    INVALID_ENUM = 2;

    // The signal name is known but the value could not be parsed for the signal type.
    PARSE_ERROR = 3;
  }
}
